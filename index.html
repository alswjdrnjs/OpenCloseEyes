<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인공지능 자세 판별기</title>
    <style>
        /* 기본 테마 및 배경 설정 (미래지향적인 다크모드) */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 메인 컨테이너 박스 */
        .app-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* 메인 타이틀 네온 효과 */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(129, 140, 248, 0.3);
        }

        /* 서브타이틀 */
        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 화려한 시작 버튼 애니메이션 */
        button {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            margin-bottom: 30px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
            background: linear-gradient(135deg, #4338ca 0%, #0891b2 100%);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 웹캠 화면 테두리 가이드라인 */
        #webcam-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        #webcam-container canvas {
            border-radius: 16px;
            border: 3px solid #818cf8;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
            background-color: #000;
        }

        /* 예측 결과창 디자인 */
        #label-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        /* 분석 결과 각각의 행 스타일 */
        #label-container div {
            font-size: 1.05rem;
            font-weight: 600;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #38bdf8;
            border-radius: 4px 8px 8px 4px;
            color: #e2e8f0;
            transition: all 0.2s ease;
        }
        
        /* 실시간 변화 느낌을 주기 위한 가상 효과 */
        #label-container div:nth-child(even) {
            border-left-color: #a855f7;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>인공지능 자세 판별기</h1>
        <div class="subtitle">Teachable Machine Image Model</div>
        
        <button type="button" onclick="init()">Start Analysis</button>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">

        const URL = "https://teachablemachine.withgoogle.com/models/ZtI4n0Gsyv/";

        let model, webcam, labelContainer, maxPredictions;

        //1. 버튼을 누르면 처음 실행되는 init() 함수.
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(200, 200, flip);
            await webcam.setup();
            await webcam.play();

            //2. loop()함수 동작을 잠깐 예약 - 화면이 갱신될 때 loop()함수를 실행해 달라고 예약.
            window.requestAnimationFrame(loop);

            //3. 버튼을 클릭한 뒤 동적으로 div 상자가 추가됨.
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) { // and class labels
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        //4. requestAnimationFrame 예약한 loop 함수가 실행됨.
        async function loop() {
            webcam.update();
            //5. predict 함수가 호출됨.
            await predict();
            //7. loop()함수 안에서 또 다른 loop()함수를 호출하면서 브라우저를 끄기 전까지 계속 무한 루플를 반복함.
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            //6. 모델이 웹캠의 화면을 예측하는 중요 동작 구현부.
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
